<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Listing</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Our Products</h1>
    </header>

    <main class="product-list">
      <article class="product-card">
        <img src="images/product1.jpg" alt="Black wireless headphones">
        <h2>Wireless Headphones</h2>
        <p class="price">Rs. 1,499</p>
        <a href="#" class="buy-button">Buy Now</a>
      </article>

      <article class="product-card">
        <img src="images/product2.jpg" alt="Silver smart watch with a black strap">
        <h2>Smart Watch</h2>
        <p class="price">Rs. 2,999</p>
        <a href="#" class="buy-button">Buy Now</a>
      </article>

      <article class="product-card">
        <img src="images/product3.jpg" alt="Blue backpack for laptop and books">
        <h2>Laptop Backpack</h2>
        <p class="price">Rs. 899</p>
        <a href="#" class="buy-button">Buy Now</a>
      </article>

      <article class="product-card">
        <img src="images/product4.jpg" alt="White bluetooth speaker">
        <h2>Bluetooth Speaker</h2>
        <p class="price">Rs. 1,199</p>
        <a href="#" class="buy-button">Buy Now</a>
      </article>

      <article class="product-card">
        <img src="images/product5.jpg" alt="Black computer keyboard">
        <h2>Keyboard</h2>
        <p class="price">Rs. 749</p>
        <a href="#" class="buy-button">Buy Now</a>
      </article>

      <article class="product-card">
        <img src="images/product6.jpg" alt="Wireless computer mouse">
        <h2>Wireless Mouse</h2>
        <p class="price">Rs. 499</p>
        <a href="#" class="buy-button">Buy Now</a>
      </article>
    </main>
  </body>
</html>
